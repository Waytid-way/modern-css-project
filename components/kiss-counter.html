<!-- Kiss Counter Component -->
<section class="kiss-section" id="kissSection">
  <div class="container">
    <div class="kiss-card card">
      <h2 class="kiss-title">Kiss Counter</h2>
      <p class="kiss-subtitle">Tap the heart to send kisses!</p>
      
      <button class="kiss-button" id="kissBtn" aria-label="Send a kiss">
        <span class="kiss-icon">💋</span>
      </button>
      
      <div class="kiss-count" id="kissCount">0 kisses</div>
      
      <div class="kiss-progress">
        <div class="kiss-progress-bar" id="kissProgress"></div>
      </div>
      
      <div class="kiss-milestones">
        <div class="milestone" data-count="10">
          <span class="milestone-icon">💋</span>
          <span class="milestone-label">10</span>
        </div>
        <div class="milestone" data-count="50">
          <span class="milestone-icon">💕</span>
          <span class="milestone-label">50</span>
        </div>
        <div class="milestone" data-count="100">
          <span class="milestone-icon">💖</span>
          <span class="milestone-label">100</span>
        </div>
        <div class="milestone" data-count="500">
          <span class="milestone-icon">💗</span>
          <span class="milestone-label">500</span>
        </div>
      </div>
    </div>
  </div>
</section>
