<!-- Countdown Timer Component -->
<section class="countdown-section" id="countdownSection">
  <div class="container">
    <div class="countdown-card card">
      <h2 class="countdown-title">Time Until We Meet Again</h2>
      
      <div class="countdown-timer">
        <div class="timer-unit">
          <div class="timer-value" id="days">00</div>
          <div class="timer-label">Days</div>
        </div>
        
        <div class="timer-separator">:</div>
        
        <div class="timer-unit">
          <div class="timer-value" id="hours">00</div>
          <div class="timer-label">Hours</div>
        </div>
        
        <div class="timer-separator">:</div>
        
        <div class="timer-unit">
          <div class="timer-value" id="minutes">00</div>
          <div class="timer-label">Minutes</div>
        </div>
        
        <div class="timer-separator">:</div>
        
        <div class="timer-unit">
          <div class="timer-value" id="seconds">00</div>
          <div class="timer-label">Seconds</div>
        </div>
      </div>
      
      <p class="countdown-message">Every moment apart makes our reunion sweeter 💕</p>
      
      <div class="countdown-target" id="countdownTarget"></div>
    </div>
  </div>
</section>
